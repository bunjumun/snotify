; Lakehorse Radio — build configuration.
;
; Why this file looks the way it does, because every line here was chosen
; against something that broke or would have:
;
;   * `platform` points at the pioarduino fork rather than the official
;     platformio/platform-espressif32. The official one is still maintained,
;     but its Arduino framework is pinned at core 2.0.17 and always has been;
;     it has never shipped core 3.x. ESPAsyncWebServer 3.x targets core 3.x.
;     Pinned to an exact release rather than the rolling `stable` tag so a
;     rebuild in six months produces the same binary.
;
;   * `board = esp32dev`, NOT esp-wrover-kit. The spec asked for a WROVER and
;     this probably is one, but the esp-wrover-kit board file declares FTDI
;     0403:6010 hwids and this board is a CP2102 (10c4:ea60), so upload-port
;     autodetection looks for the wrong device. esp32dev is the generic
;     4MB classic-ESP32 profile and is what a CP2102 devkit actually is.
;
;   * PSRAM is ON, for the Bluetooth (A2DP) work, which needs audio buffers
;     the internal heap cannot spare (it bottoms out around 60KB while two
;     listeners stream; HANDOFF.md, 2026-11-21 baseline). -DBOARD_HAS_PSRAM
;     IS the switch, which is not obvious: the prebuilt framework is compiled
;     with CONFIG_SPIRAM=y, but pioarduino defines ESP32_ARDUINO_LIB_BUILDER,
;     and with that set and BOARD_HAS_PSRAM not set, esp32-hal-psram.h
;     #undefs CONFIG_SPIRAM, so the Arduino core never initialises PSRAM and
;     the board reports 0 bytes with no error. That is exactly what this box
;     did until this flag went in; with it, 4 MB comes up. The rev v1.0 cache
;     workaround (-mfix-esp32-psram-cache-issue, MEMW strategy) needs no
;     flag here: the framework already puts it on this project's compile
;     line (checked with `pio run -v`). If the boot line ever says PSRAM was
;     not found, the reason is printed with it.
;
;   * upload_speed = 115200, which looks needlessly slow. It is not. A flash
;     read at 460800 on this board and cable failed with "Invalid head of
;     packet (0xFF): possible serial noise or corruption". 115200 read the
;     same flash cleanly. A slow upload that works beats a fast one that
;     silently corrupts an image.

[platformio]
default_envs = radio

[env:radio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  ; Keep the async TCP task off core 0, where the WiFi stack lives.
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128

lib_deps =
  ESP32Async/AsyncTCP @ ^3.5.0
  ESP32Async/ESPAsyncWebServer @ ^3.12.1
  bblanchon/ArduinoJson @ ^7.4.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 115200

; Module 6 trial: the same radio firmware on Arduino core 2.0.17 (IDF 4.4),
; because A2DP source to ML301 pairs then drops on core 3.3.11 / IDF 5.5 and
; works on 2.0.17 (HANDOFF.md, Module 5). Kept beside env:radio until it is
; proven, so nothing shipped changes. NOTE: building this replaces the shared
; framework-arduinoespressif32 package; switching back costs a reinstall.
[env:radio-core2]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128
  ; AsyncTCP 3.x defaults to a 16 KB stack; 8 KB is ample for these handlers
  ; (JSON documents live on the heap) and internal RAM is what Bluetooth
  ; needs most.
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D LAKEHORSE_BT=1
lib_deps =
  ESP32Async/AsyncTCP @ ^3.5.0
  ESP32Async/ESPAsyncWebServer @ ^3.12.1
  bblanchon/ArduinoJson @ ^7.4.3
  ; Box playback (src/box_player.cpp). v1.8.8 is the version proven against
  ; ML301 on this core in the Module 5 spike; a git tag, not in the registry.
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
monitor_speed = 115200
upload_speed = 115200

; Host-side unit tests for the pure logic (playlist validation), run with
; `pio test -e native`. No board involved, so these can run in CI or on a
; laptop with nothing plugged in.
[env:native]
platform = native
; PlatformIO leaves src/ out of a test build unless told otherwise, so without
; test_build_src the validation unit never gets compiled in and the test fails
; to link rather than failing to pass, which looks like a different problem.
test_build_src = yes
build_src_filter = +<playlist_validate.cpp> +<hostname_rules.cpp> +<track_name.cpp> +<pcm_format.cpp>
build_flags = -std=gnu++17 -I src -D LAKEHORSE_NATIVE_TEST
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
test_framework = unity
