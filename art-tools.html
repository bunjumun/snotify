<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image tools</title>
<meta name="description" content="Image tools — the band's graphic tools, one door each." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▨</text></svg>" />
<!-- Palette, page frame, modals, gate — shared with index.html, music.html, art.html -->
<link rel="stylesheet" href="core.css?v=35" />
<!-- Per-band themes, each scoped to body[data-theme=…] (see BAND_THEME in core.js) -->
<link rel="stylesheet" href="theme-dazzle.css?v=31" />
<style>
  /* Follow-up to CR-83, 23 Aug: "open a new page with a door for each image
     tool rather than the drop down menu". Same .door card shape art.html's
     own doors screen uses, in a grid rather than a two-up row since the
     tool count varies per band. core.js renders the doors themselves
     (renderToolDoors, shared with the #toolMenu dropdown it replaces here)
     into #toolDoors — nothing tool-specific lives in this file. */
  .toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 8px; }
  .door {
    background: var(--bg-row); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 18px; cursor: pointer; text-align: center; text-decoration: none;
    transition: border-color .12s, background .12s; color: var(--text); font: inherit; display: block;
  }
  .door:hover { background: var(--bg-hover); border-color: var(--accent); }
  .door .dooricon { font-size: 30px; margin-bottom: 8px; }
  .door .doortitle { font-weight: 700; font-size: 14.5px; }
  .door .doorsub { color: var(--text-dim); font-size: 12px; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body class="locked">

  <!-- Band gate — same two-step front door as every other page, same
       localStorage entry, so one band password opens all of them. The
       markup is duplicated; the logic behind it lives once, in core.js. -->
  <div class="modal-back" id="gateModal">
    <div class="modal" style="max-width:360px">
      <h2 data-txt="tools.gate.title">▨ Image tools</h2>

      <div id="gateStep1">
        <div class="hint" style="margin-bottom:6px">Enter your band to continue.</div>
        <label>Band name</label>
        <input type="text" id="gateName" autocomplete="off" autocapitalize="none" />
        <div class="status err" id="gateErr1"></div>
        <div id="gateSuggest" style="display:none"></div>
        <div class="actions"><button class="btn primary" id="gateNext">Continue</button></div>
      </div>

      <div id="gateStep2" style="display:none">
        <div class="hint" style="margin-bottom:6px">Password for <b id="gateBandLabel"></b>.</div>
        <label>Band password</label>
        <input type="password" id="gatePass" autocomplete="off" />
        <div class="status err" id="gateErr2"></div>
        <div class="actions">
          <button class="btn ghost" id="gateBack">Back</button>
          <button class="btn primary" id="gateGo">Enter</button>
        </div>
      </div>

      <div class="hint" style="margin-top:14px;text-align:center">
        <span class="linky" id="adminOpenLink">Site admin</span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <header class="app">
      <div class="logo">▨</div>
      <div>
        <h1 data-txt="tools.title">Image tools</h1>
        <p data-txt="tools.tagline">The tools enabled in config mode</p>
      </div>
      <div class="count" id="bandCount"></div>
      <button class="addbtn" id="backBtn" title="Back to artwork">← Art</button>
      <button class="addbtn" id="navBtn" title="Other pages">☰ Pages ▾</button>
      <div id="navMenu">
        <a class="navitem" id="musicBtn" href="music.html">🎵 Music</a>
        <a class="navitem" id="homeBtn" href="index.html">💿 Sn'Album</a>
      </div>
      <button class="addbtn" id="adminBtn" title="Site admin — add a band library">⚙</button>
      <button class="addbtn" id="logoutBtn" title="Log out of this band">Log out</button>
    </header>

    <div class="toolgrid" id="toolDoors"></div>
  </div>

<!-- Shared layer: Supabase access, the band gate, routing, helpers. A classic
     script, so everything it declares is in scope for the module below. -->
<script src="core.js?v=34"></script>
<script type="module">
// core.js owns the gate, the route, the tool list and the doors it renders
// into #toolDoors (renderToolDoors, called from renderToolMenu's own choke
// point) — this page only needs to get itself authed and hand back control.
App.init   = () => init();
App.onLock = () => {};

async function init(){
  let band = route.band && bandSlugOf(route.band);
  if (!band) band = wantsHome() ? '' : lastBand();
  if (!band){ showGate(null, true, lastBand() || null); return; }
  if (!isAuthed(band)){ showGate(band, true); return; }

  curBand = band;
  applyTheme(curBand);
  curBandTitle = curBand;
  try {
    const lib = await libRpc('get_library', {});
    curBandTitle = (lib && lib.title) || curBand;
  } catch (err) {
    if (isAuthErr(err)){ clearAuth(band); return showGate(band, true); }
    // A failed title fetch is not worth blocking the door grid over.
  }
  document.title = 'Image tools · ' + curBandTitle;
  document.body.classList.add('authed');
  unlockView();
}

on('backBtn', 'click', () => { location.href = 'art.html?b=' + encodeURIComponent(curBand); });

if (curBand || route.band){
  const b = encodeURIComponent(bandSlugOf(route.band || curBand));
  $('musicBtn').href = 'music.html?b=' + b;
  $('homeBtn').href  = 'index.html?b=' + b;
}

init();
</script>
</body>
</html>
