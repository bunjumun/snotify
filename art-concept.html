<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Art Concepts</title>
<meta name="description" content="Art Concepts — concept boards for the band’s art direction: notes, images, links and draw-over-image sketches." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>" />
<link rel="stylesheet" href="core.css?v=35" />

<style>
  /* Concept-only surface. Everything shared lives in core.css. This page is the
     lore/assets draft editor (schema-v21's slug-agnostic lore_* RPCs, here on
     the 'concept' slug) with a block list in place of the single textarea:
     text blocks and image blocks, an image block carrying an optional
     draw-over-image sketch from sketchpad.js. Not read by the game — it is
     working notes for the band. */

  .doclayout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .doclayout { grid-template-columns: 1fr; } }

  .stack { background: var(--bg-row); border-radius: 10px; padding: 8px; }
  .stack .backlink {
    display: inline-block; color: var(--text-mute); text-decoration: none;
    font-size: 12.5px; padding: 2px 8px 6px;
  }
  .stack .backlink:hover { color: var(--text); }
  .stack .shead {
    display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px;
    color: var(--text-mute); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  .stack .shead .grow { flex: 1; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .draft {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent;
  }
  .draft:hover { background: var(--bg-hover); }
  .draft.on { border-color: var(--accent); background: var(--bg-hover); }
  .draft .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft .when { color: var(--text-mute); font-size: 12px; }
  .draft .tgt { color: var(--text-mute); font-size: 11px; white-space: nowrap; }
  .draft .ddel {
    background: none; border: 0; color: var(--text-mute); cursor: pointer;
    font-size: 13px; padding: 0 2px; opacity: 0; transition: opacity .12s;
  }
  .draft:hover .ddel { opacity: 1; }
  .draft .ddel:hover { color: #ff6b6b; }
  .draft .ord { display: flex; flex-direction: column; gap: 1px; }
  .draft .ord button {
    background: none; border: 0; color: var(--text-mute); cursor: pointer; line-height: .8;
    font-size: 11px; padding: 0 2px;
  }
  .draft .ord button:hover { color: var(--text); }

  .editor { display: flex; flex-direction: column; gap: 12px; }
  .editor .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .editor .row .grow { flex: 1; }
  .editor input.nm {
    background: #0a0b0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; min-width: 180px;
  }

  .targetrow {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--bg-row); border-radius: 10px; padding: 10px 12px;
  }
  .targetrow label { color: var(--text-mute); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .targetrow select {
    background: #0a0b0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px;
  }

  .row.toolbar { gap: 6px; }
  .row.toolbar select {
    background: #0a0b0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; font-size: 13px;
  }

  /* The board. Twelve columns so a block can be full, half or third width and
     references sit side by side instead of one under the other. */
  .blocks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: start; }
  .cblock {
    grid-column: span var(--w, 12);
    background: var(--bg-row); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  @media (max-width: 900px) { .cblock { grid-column: span 12; } }
  .cblock .bw { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 11px; padding: 0 2px; }
  .cblock .bw:hover { color: var(--text); }
  .cblock .bw.on { color: var(--accent); }
  .cblock.editing { border-color: var(--accent); }
  /* Block chrome is editor furniture, so it stays out of the way until you
     reach for it. The card reads as content first. */
  .cblock .bhead { display: flex; align-items: center; gap: 8px; min-height: 16px; }
  .cblock .bkind {
    color: var(--text-mute); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    opacity: 0; transition: opacity .12s;
  }
  .cblock:hover .bkind, .cblock.editing .bkind { opacity: 1; }
  .cblock .bhead .grow { flex: 1; }
  .cblock .bhead button { opacity: 0; transition: opacity .12s; }
  .cblock:hover .bhead button, .cblock.editing .bhead button { opacity: 1; }
  .cblock .bx { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 15px; padding: 0 3px; }
  .cblock .bx:hover { color: #ff6b6b; }
  .cblock .bmove { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 12px; padding: 0 3px; }
  .cblock .bmove:hover { color: var(--text); }
  .cblock .bedit {
    background: none; border: 0; color: var(--text-mute); cursor: pointer;
    font-size: 12px; font-weight: 600; padding: 0 4px;
  }
  .cblock .bedit:hover { color: var(--accent); }
  .cblock.editing .bedit { color: var(--accent); opacity: 1; }
  /* The box only exists while you are editing, and grows with the text rather
     than being a fixed-height scroller sitting over the content. */
  .cblock textarea {
    width: 100%; resize: none; overflow: hidden;
    font: 14px/1.65 inherit; font-family: inherit;
    background: #0a0b0f; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  /* Reading view: this is the content, not a preview strip. */
  .cblock .preview { color: var(--text); font-size: 14px; line-height: 1.65; }
  .cblock .readtext { cursor: text; border-radius: 8px; padding: 2px 4px; margin: -2px -4px; }
  .cblock .readtext:hover { background: rgba(255,255,255,.03); }
  .cblock .preview p { margin: 0 0 8px; }
  .cblock .preview p:last-child { margin-bottom: 0; }
  .cblock .preview ul { margin: 0 0 8px; padding-left: 20px; }
  .cblock .preview a { color: var(--accent); }
  .cblock .emptyhint { color: var(--text-mute); font-style: italic; }
  .cblock .bcap { color: var(--text-dim); font-size: 12.5px; }
  .cblock .bpen { align-self: flex-start; }
  .cimg-host { position: relative; display: block; line-height: 0; max-width: 100%; }
  .cimg-host img {
    display: block; width: 100%; max-height: 56vh; object-fit: contain; border-radius: 8px;
    border: 1px solid var(--line); background: #0a0b0f; cursor: zoom-in;
  }
  /* Click to enlarge */
  .lightbox {
    position: fixed; inset: 0; background: rgba(4,5,8,.92); z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; cursor: zoom-out;
  }
  .lightbox .lbwrap { position: relative; line-height: 0; max-width: 100%; max-height: 100%; }
  .lightbox img { max-width: 100%; max-height: 88vh; border-radius: 8px; display: block; }
  .lightbox .lbcap { color: var(--text-dim); font-size: 13px; text-align: center; padding-top: 10px; line-height: 1.5; }
  .cblock .balt {
    background: #0a0b0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; width: 100%;
  }
  .cblock a.clink {
    color: var(--accent); font-weight: 600; text-decoration: none;
    word-break: break-all; align-self: flex-start;
  }
  .cblock a.clink:hover { text-decoration: underline; }

  /* Notes on a block — the back-and-forth. Same shape as the comment lists
     elsewhere on the site, scoped to one block. */
  .cblock .bcmt { background: none; border: 0; color: var(--text-mute); cursor: pointer; font-size: 12px; padding: 0 3px; }
  .cblock .bcmt:hover, .cblock .bcmt.on { color: var(--accent); }
  .cblock .bcmt { opacity: 1 !important; }
  .thread { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .thread .hint { color: var(--text-mute); font-size: 12.5px; }
  .cmt { font-size: 13px; line-height: 1.5; }
  .cmt.reply { margin: 6px 0 0 14px; padding-left: 8px; border-left: 2px solid var(--line); }
  .cmt.done .ctxt { text-decoration: line-through; color: var(--text-mute); }
  .cmt .cwho { color: var(--text-mute); font-size: 11.5px; }
  .cmt .cdone { color: var(--accent-2, #00d0a4); font-weight: 700; }
  .cmt .ctxt { color: var(--text); margin: 2px 0; white-space: pre-wrap; }
  .cmt .cacts { display: flex; gap: 10px; opacity: 0; transition: opacity .12s; }
  .cmt:hover .cacts { opacity: 1; }
  .cmt .cact { color: var(--text-mute); font-size: 11.5px; cursor: pointer; }
  .cmt .cact:hover { color: var(--text); }
  .cmt .cact.danger:hover { color: #ff6b6b; }
  .cadd { display: flex; gap: 6px; }
  .cadd input {
    flex: 1; min-width: 0; background: #0a0b0f; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px;
  }
  .row.toolbar input.cname { flex: 0 0 110px; min-width: 0; }

  .addblock { display: flex; gap: 8px; flex-wrap: wrap; }
  .pastehint { color: var(--text-mute); font-size: 12px; }

  #musicBtn, #homeBtn, #artBtn, #releaseBtn { display: none; }
  body.authed #musicBtn, body.authed #homeBtn, body.authed #artBtn, body.authed #releaseBtn { display: inline-flex; }
  #gameBtn { display: none; }
  body.has-game #gameBtn { display: inline-flex; }
</style>

<script src="core.js?v=35"></script>
<script type="module">
import { createSketchPad, paintStrokes } from './sketchpad.js?v=1';

const INBOX_MAX = 25 * 1024 * 1024;

let drafts = [];            // the stack, in position order
let current = null;         // the draft open in the editor, or null for a new one
let doc = { target: null, blocks: [] };
let dirty = false;
let lib = { songs: [] }, releases = [];
const pads = new Map();     // block index -> sketchpad handle (rebuilt each render)

App.init     = () => init();
App.onLock   = () => { showLockedChrome(); drafts = []; $('conceptCount').textContent = ''; };
App.onLogout = () => { drafts = []; current = null; doc = { target: null, blocks: [] }; };

function showLockedChrome(){ $('doc').style.display = 'none'; }

async function init(){
  curBand = null;
  let band = route.band && bandSlugOf(route.band);
  if (!band) band = wantsHome() ? '' : lastBand();
  if (!band){ showGate(null, true, lastBand() || null); return; }
  if (!isAuthed(band)){ showGate(band, true); return; }

  curBand = band;
  applyTheme(curBand);
  document.body.classList.add('authed');
  unlockView();

  const b = encodeURIComponent(curBand);
  $('musicBtn').href  = 'music.html?b=' + b;
  $('artBtn').href    = 'art.html?b=' + b;
  $('assetsBtn').href = 'assets.html?b=' + b;
  $('releaseBtn').href = 'release-builder.html?b=' + b;
  $('homeBtn').href   = 'index.html?b=' + b;
  $('backArt').href   = 'art.html?b=' + b;

  try {
    const [l, r] = await Promise.all([
      libRpc('get_library', {}),
      libRpc('get_releases', {}).catch(() => []),
    ]);
    lib = l || { songs: [] };
    releases = r || [];
  } catch (e) {
    if (isAuthErr(e)){ clearAuth(band); return showGate(band, true); }
  }

  $('doc').style.display = '';
  await openConcept();
}

// ---------- The stack ----------
async function openConcept(){
  try {
    drafts = (await libRpc('lore_list', { d: 'concept' })) || [];
  } catch (e) {
    drafts = [];
    say(e.message || 'Could not load the drafts.', true);
  }
  await loadComments();
  renderDrafts();
  // No "live" draft on this tool — nothing downstream reads it, unlike lore.
  // The most recent draft opens; lore_list returns them newest-first.
  if (drafts[0]) openDraft(drafts[0]);
  else newDraft(true);
}

function targetLabel(t){
  if (!t || !t.kind) return '';
  if (t.kind === 'release'){
    const r = releases.find(x => x.id === t.ref);
    return 'release: ' + (r ? r.title : t.ref);
  }
  const s = (lib.songs || []).find(x => x.folder === t.ref);
  return 'song: ' + (s ? (s.title || s.folder) : t.ref);
}

function renderDrafts(){
  const box = $('drafts');
  $('stackCount').textContent = drafts.length ? `(${drafts.length})` : '';
  $('conceptCount').textContent = drafts.length
    ? `${drafts.length} draft${drafts.length === 1 ? '' : 's'}` : '';
  if (!drafts.length){
    box.innerHTML = '<div class="hint" style="padding:8px 10px">No drafts yet. Start one.</div>';
    return;
  }
  box.innerHTML = '';
  drafts.forEach((d, i) => {
    const t = parseDoc(d.body).target;
    const row = document.createElement('div');
    row.className = 'draft' + (current && current.id === d.id ? ' on' : '');
    row.innerHTML =
      `<span class="ord">
         <button title="Move up" data-up="${i}">▲</button>
         <button title="Move down" data-dn="${i}">▼</button>
       </span>
       <span class="nm">${esc(d.name)}</span>
       ${t && t.kind ? `<span class="tgt">${esc(targetLabel(t))}</span>` : ''}
       <span class="when">${timeago(d.updated || d.created)}</span>
       <button class="ddel" title="Delete this draft" data-del="${i}">🗑</button>`;
    row.addEventListener('click', (e) => {
      if (e.target.dataset.up !== undefined) return move(i, -1);
      if (e.target.dataset.dn !== undefined) return move(i, 1);
      if (e.target.dataset.del !== undefined) return deleteDraft(d);
      openDraft(d);
    });
    box.appendChild(row);
  });
}

function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c])); }

async function move(i, dir){
  const j = i + dir;
  if (j < 0 || j >= drafts.length) return;
  const [row] = drafts.splice(i, 1);
  drafts.splice(j, 0, row);
  renderDrafts();
  try { await libRpc('lore_reorder', { ids: drafts.map(d => d.id), d: 'concept' }); }
  catch (e) { say(e.message, true); }
}

async function deleteDraft(d){
  const only = drafts.length === 1;
  const msg = only
    ? `"${d.name}" is the only draft. Clear it back to empty?`
    : `Delete draft "${d.name}"? This cannot be undone.`;
  if (!confirm(msg)) return;
  try {
    if (only){
      // A doc with no drafts just makes a fresh empty one on next open, so
      // "delete the last draft" and "blank the last draft" reach the same
      // place. lore_trash refuses the only/active version anyway.
      await libRpc('lore_save', {
        nm: 'New concept',
        body_in: JSON.stringify({ target: null, blocks: [{ id: newBlockId(), t: 'text', md: '' }] }),
        vid: d.id, d: 'concept',
      });
      say('Cleared.');
    } else {
      // lore_trash won't take the active version; promote another first.
      if (d.active){
        const other = drafts.find(x => x.id !== d.id);
        if (other) await libRpc('lore_set_active', { vid: other.id });
      }
      await libRpc('lore_trash', { vid: d.id });
      say('Deleted.');
    }
    drafts = (await libRpc('lore_list', { d: 'concept' })) || [];
    current = null;
    if (drafts[0]) openDraft(drafts[0]); else newDraft(true);
    renderDrafts();
  } catch (e) { say(e.message, true); }
}

// ---------- The document body ----------
// Every block carries a stable id, because a comment thread hangs off it and
// an array index would re-point every thread the moment a block moves.
// Blocks written before comments existed get one on read; `idsMinted` says the
// board must be saved before those threads are safe, and addComment does it.
let idsMinted = false;
const newBlockId = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function withIds(blocks){
  return blocks.map(b => {
    if (b && typeof b.id === 'string' && b.id) return b;
    idsMinted = true;
    return { ...b, id: newBlockId() };
  });
}

function parseDoc(body){
  idsMinted = false;
  try {
    const d = JSON.parse(body || '{}');
    if (d && Array.isArray(d.blocks))
      return { target: d.target && d.target.kind ? d.target : null, blocks: withIds(d.blocks) };
  } catch {}
  // Anything that isn't our JSON is treated as one text block, so a hand-set
  // or legacy body still opens rather than throwing.
  return { target: null, blocks: withIds(body && body.trim() ? [{ t: 'text', md: body }] : []) };
}

function openDraft(d){
  if (dirty && !confirm('Discard unsaved changes to this draft?')) return;
  current = d;
  $('draftName').value = d.name || '';
  doc = parseDoc(d.body);
  dirty = false;
  editing.clear();
  syncTargetControls();
  renderBlocks();
  renderDrafts();
}

function newDraft(silent){
  if (!silent && dirty && !confirm('Discard unsaved changes?')) return;
  current = null;
  $('draftName').value = 'New concept';
  doc = { target: null, blocks: [{ id: newBlockId(), t: 'text', md: '' }] };
  dirty = !silent;
  editing.clear();
  syncTargetControls();
  renderBlocks();
  renderDrafts();
}

// ---------- Target picker ----------
function syncTargetControls(){
  const k = doc.target && doc.target.kind ? doc.target.kind : '';
  $('tgtKind').value = k;
  const ref = $('tgtRef');
  if (!k){ ref.style.display = 'none'; ref.innerHTML = ''; return; }
  ref.style.display = '';
  const opts = k === 'release'
    ? (releases || []).map(r => [r.id, r.title || r.id])
    : ((lib.songs || []).filter(s => s && s.folder).map(s => [s.folder, s.title || s.folder]));
  ref.innerHTML = '<option value="">Choose…</option>' +
    opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
  ref.value = (doc.target && doc.target.ref) || '';
}

on('tgtKind', 'change', () => {
  const k = $('tgtKind').value;
  doc.target = k ? { kind: k, ref: '' } : null;
  dirty = true;
  syncTargetControls();
});
on('tgtRef', 'change', () => {
  if (!doc.target) return;
  doc.target.ref = $('tgtRef').value || '';
  dirty = true;
});

// ---------- Blocks ----------
const autoFormat = (txt) => {
  const e = (s) => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const linkify = (s) => s.replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)]/g,
    u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const lines = String(txt || '').replace(/\r\n?/g, '\n').split('\n');
  const out = []; let inList = false;
  for (const raw of lines){
    const m = raw.match(/^\s*-\s+(.*)$/);
    if (m){
      if (!inList){ out.push('<ul>'); inList = true; }
      out.push('<li>' + linkify(e(m[1])) + '</li>');
    } else {
      if (inList){ out.push('</ul>'); inList = false; }
      out.push(raw.trim() ? '<p>' + linkify(e(raw)) + '</p>' : '<br>');
    }
  }
  if (inList) out.push('</ul>');
  return out.join('');
};

// Which blocks are open for editing. The board reads as a board by default —
// a raw textarea sitting permanently over the text, with the same text rendered
// again underneath, was the thing that made this unusable to read.
const editing = new Set();
let focusBlock = null;   // block index to focus after the next render

function renderBlocks(){
  pads.forEach(p => p.destroy());
  pads.clear();
  const wrap = $('blocks');
  wrap.innerHTML = '';
  if (!doc.blocks.length){
    wrap.innerHTML = '<div class="hint" style="padding:4px 2px">Empty. Add text, an image, or a link below.</div>';
    return;
  }
  doc.blocks.forEach((blk, i) => wrap.appendChild(blockEl(blk, i)));
  if (focusBlock !== null){
    const ta = wrap.children[focusBlock] && wrap.children[focusBlock].querySelector('textarea, input');
    if (ta){ ta.focus(); if (ta.setSelectionRange) ta.setSelectionRange(ta.value.length, ta.value.length); }
    focusBlock = null;
  }
}

function openEditor(i){ editing.add(i); focusBlock = i; renderBlocks(); }

function autosize(ta){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }

// Images default to half width so two references sit side by side; text and
// links run full width. Overridable per block, stored in the body JSON.
const WIDTHS = [[12, '1/1'], [6, '1/2'], [4, '1/3']];
const blockW = (blk) => blk.w || (blk.t === 'image' ? 6 : 12);

function openLightbox(blk){
  const box = document.createElement('div');
  box.className = 'lightbox';
  const wrap = document.createElement('div');
  wrap.className = 'lbwrap';
  const img = document.createElement('img');
  img.src = publicUrl(blk.ref) || '';
  img.alt = blk.alt || '';
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  wrap.append(img, cv);
  box.appendChild(wrap);
  if (blk.alt && blk.alt.trim()){
    const cap = document.createElement('div');
    cap.className = 'lbcap';
    cap.textContent = blk.alt;
    box.appendChild(cap);
  }
  const paint = () => paintStrokes(cv, img, blk.sketch || []);
  img.addEventListener('load', paint);
  if (img.complete && img.naturalWidth) requestAnimationFrame(paint);
  const esc = (e) => { if (e.key === 'Escape') close(); };
  function close(){
    box.remove();
    window.removeEventListener('resize', paint);
    document.removeEventListener('keydown', esc);
  }
  box.addEventListener('click', close);
  window.addEventListener('resize', paint);
  document.addEventListener('keydown', esc);
  document.body.appendChild(box);
}

function blockEl(blk, i){
  const on = editing.has(i);
  const card = document.createElement('div');
  card.className = 'cblock' + (on ? ' editing' : '');
  card.style.setProperty('--w', blockW(blk));
  const head = document.createElement('div');
  head.className = 'bhead';
  head.innerHTML =
    `<span class="bkind">${blk.t === 'image' ? 'Image' : blk.t === 'link' ? 'Link' : 'Text'}</span>
     <span class="grow"></span>
     <button class="bcmt${openThreads.has(blk.id) ? ' on' : ''}" data-cmt title="Notes on this block">💬${openCount(blk.id) ? ' ' + openCount(blk.id) : ''}</button>
     ${WIDTHS.map(([w, lbl]) => `<button class="bw${blockW(blk) === w ? ' on' : ''}" data-w="${w}" title="${lbl} width">${lbl}</button>`).join('')}
     <button class="bedit" data-ed title="${on ? 'Finish editing' : 'Edit this block'}">${on ? 'Done' : '✎'}</button>
     <button class="bmove" data-up title="Move up">▲</button>
     <button class="bmove" data-dn title="Move down">▼</button>
     <button class="bx" data-rm title="Remove this block">✕</button>`;
  head.querySelector('[data-cmt]').onclick = () => {
    openThreads.has(blk.id) ? openThreads.delete(blk.id) : openThreads.add(blk.id);
    renderBlocks();
  };
  head.querySelectorAll('[data-w]').forEach(b => {
    b.onclick = () => { blk.w = +b.dataset.w; dirty = true; renderBlocks(); };
  });
  head.querySelector('[data-ed]').onclick = () => {
    on ? editing.delete(i) : editing.add(i);
    focusBlock = on ? null : i;
    renderBlocks();
  };
  head.querySelector('[data-up]').onclick = () => moveBlock(i, -1);
  head.querySelector('[data-dn]').onclick = () => moveBlock(i, 1);
  head.querySelector('[data-rm]').onclick = () => {
    if (!confirm('Remove this block?')) return;
    doc.blocks.splice(i, 1); editing.clear(); dirty = true; renderBlocks();
  };
  card.appendChild(head);

  if (blk.t === 'image'){
    const host = document.createElement('div');
    host.className = 'cimg-host';
    const img = document.createElement('img');
    img.alt = blk.alt || '';
    img.src = publicUrl(blk.ref) || '';
    img.title = 'Click to enlarge';
    host.appendChild(img);
    card.appendChild(host);
    img.addEventListener('click', () => { if (!pads.get(i) || !pads.get(i).isActive()) openLightbox(blk); });

    if (on){
      const alt = document.createElement('input');
      alt.className = 'balt';
      alt.placeholder = 'Caption (optional)';
      alt.value = blk.alt || '';
      alt.oninput = () => { blk.alt = alt.value; img.alt = alt.value; dirty = true; };
      card.appendChild(alt);
    } else if (blk.alt && blk.alt.trim()){
      const cap = document.createElement('div');
      cap.className = 'bcap';
      cap.textContent = blk.alt;
      card.appendChild(cap);
    }

    // The pen stays available without opening the editor — drawing on a
    // reference is the point of the tool, not a settings change.
    const drawBtn = document.createElement('button');
    drawBtn.className = 'btn ghost bpen';
    drawBtn.textContent = (blk.sketch && blk.sketch.length) ? '✎ Redraw over this' : '✎ Draw over this';
    card.appendChild(drawBtn);

    const pad = createSketchPad(host, img);
    pads.set(i, pad);
    pad.onDone((strokes) => {
      blk.sketch = strokes || null;
      dirty = true;
      drawBtn.textContent = (blk.sketch && blk.sketch.length) ? '✎ Redraw over this' : '✎ Draw over this';
    });
    drawBtn.onclick = () => { if (!pad.isActive()) pad.start(blk.sketch || []); };
    const draw = () => pad.renderStatic(blk.sketch || []);
    if (img.complete && img.naturalWidth) draw();
    img.addEventListener('load', draw);
  } else if (blk.t === 'link'){
    // Any URL, shown as a real clickable link with an optional label.
    const a = document.createElement('a');
    a.className = 'clink';
    a.target = '_blank'; a.rel = 'noopener';
    const paint = () => {
      a.href = blk.url || '#';
      a.textContent = (blk.label && blk.label.trim()) || blk.url || '(no link)';
    };
    paint();
    card.appendChild(a);
    if (on){
      const lbl = document.createElement('input');
      lbl.className = 'balt';
      lbl.placeholder = 'Label (optional)';
      lbl.value = blk.label || '';
      lbl.oninput = () => { blk.label = lbl.value; dirty = true; paint(); };
      card.appendChild(lbl);
      const url = document.createElement('input');
      url.className = 'balt';
      url.type = 'url';
      url.placeholder = 'https://…';
      url.value = blk.url || '';
      url.oninput = () => { blk.url = url.value; dirty = true; paint(); };
      card.appendChild(url);
    }
  } else if (on){
    // Editing: the box replaces the read view in place and grows with the
    // text, rather than sitting on top of it as a fixed-height scroller.
    const ta = document.createElement('textarea');
    ta.value = blk.md || '';
    ta.placeholder = 'Concept notes…  URLs become links, and lines starting with "- " become bullets.';
    ta.oninput = () => { blk.md = ta.value; dirty = true; autosize(ta); };
    card.appendChild(ta);
    requestAnimationFrame(() => autosize(ta));
  } else {
    // Reading: just the formatted text. Click it to edit.
    const prev = document.createElement('div');
    prev.className = 'preview readtext';
    prev.innerHTML = (blk.md && blk.md.trim())
      ? autoFormat(blk.md)
      : '<span class="emptyhint">Empty. Click to write.</span>';
    prev.title = 'Click to edit';
    prev.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;   // following a link is not editing
      openEditor(i);
    });
    card.appendChild(prev);
  }
  if (openThreads.has(blk.id)) card.appendChild(threadEl(blk));
  return card;
}

function moveBlock(i, dir){
  const j = i + dir;
  if (j < 0 || j >= doc.blocks.length) return;
  const [b] = doc.blocks.splice(i, 1);
  doc.blocks.splice(j, 0, b);
  editing.clear();
  dirty = true;
  renderBlocks();
}

// ---------- Comments ----------
// The data layer is the site's own: same comments table, same RPCs, same
// one-level threading and resolve. comments.song_id is free text validated
// only by a `<band>/` prefix (schema-v3's comment_key convention), so a
// concept thread keys as `<band>/concept:<blockId>` and needs no migration.
let cCache = {};              // blockId -> mapped rows
const openThreads = new Set(); // blockIds whose thread is expanded

const cKey = (blockId) => `${curBand}/concept:${blockId}`;
const mapC = (r) => ({ id: r.id, key: r.song_id, text: r.text, name: r.name || '',
                       parentId: r.parent_id || null, resolved: !!r.resolved,
                       resolvedBy: r.resolved_by || '',
                       editedAt: r.edited_at ? Date.parse(r.edited_at) : null,
                       at: Date.parse(r.created_at) });

async function loadComments(){
  cCache = {};
  let rows = [];
  try { rows = (await libRpc('get_comments', {})) || []; }
  catch { return; }   // comments are an extra; a failure must not blank the board
  const pre = `${curBand}/concept:`;
  for (const r of rows){
    if (!r.song_id || !String(r.song_id).startsWith(pre)) continue;
    const bid = String(r.song_id).slice(pre.length);
    (cCache[bid] || (cCache[bid] = [])).push(mapC(r));
  }
}

const threadFor = (bid) => (cCache[bid] || []).slice().sort((a, b) => a.at - b.at);
const rootsFor  = (bid) => threadFor(bid).filter(c => !c.parentId);
const repliesFor = (bid, rootId) => threadFor(bid).filter(c => c.parentId === rootId);
const openCount = (bid) => rootsFor(bid).filter(c => !c.resolved).length;

async function addComment(bid, text, parentId){
  const txt = (text || '').trim();
  if (!txt) return;
  // A thread hangs off the block id, so the id has to be in the saved body
  // before the comment can find its way back. Save first, once, deliberately.
  if (idsMinted || dirty){
    await save(false);
    if (dirty) return;   // save failed; don't strand the comment
  }
  const who = ($('cName').value || '').trim();
  localStorage.setItem('mp_name', who);
  try {
    const row = await libRpc('add_comment', {
      sid: cKey(bid), time_s: 0, txt, who, ver: '', vid: null,
      parent_id: parentId || null,
    });
    if (row) (cCache[bid] || (cCache[bid] = [])).push(mapC(row));
    renderBlocks();
  } catch (e) { say(e.message, true); }
}

async function resolveComment(bid, cid, on){
  try {
    const row = await libRpc('resolve_comment', {
      cid, is_resolved: on, who: ($('cName').value || '').trim() });
    const list = cCache[bid] || [];
    const i = list.findIndex(c => c.id === cid);
    if (i !== -1 && row) list[i] = mapC(row);
    renderBlocks();
  } catch (e) { say(e.message, true); }
}

async function deleteComment(bid, cid){
  if (!confirm('Delete this note?')) return;
  try {
    await libRpc('delete_comment', { cid });
    cCache[bid] = (cCache[bid] || []).filter(c => c.id !== cid && c.parentId !== cid);
    renderBlocks();
  } catch (e) { say(e.message, true); }
}

function threadEl(blk){
  const bid = blk.id;
  const box = document.createElement('div');
  box.className = 'thread';
  const roots = rootsFor(bid);
  if (!roots.length){
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'No notes on this yet.';
    box.appendChild(hint);
  }
  roots.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cmt' + (c.resolved ? ' done' : '');
    el.innerHTML =
      `<div class="cwho">${c.name ? `<b>${esc(c.name)}</b> · ` : ''}${timeago(c.at)}`
      + `${c.editedAt ? ' · edited' : ''}${c.resolved ? ' · <span class="cdone">settled</span>' : ''}</div>`
      + `<div class="ctxt">${esc(c.text)}</div>`
      + `<div class="cacts">`
      + `<span class="cact" data-reply>Reply</span>`
      + `<span class="cact" data-res>${c.resolved ? 'Reopen' : 'Settle'}</span>`
      + `<span class="cact danger" data-del>Delete</span></div>`;
    el.querySelector('[data-res]').onclick = () => resolveComment(bid, c.id, !c.resolved);
    el.querySelector('[data-del]').onclick = () => deleteComment(bid, c.id);
    el.querySelector('[data-reply]').onclick = () => {
      const t = prompt('Reply');
      if (t) addComment(bid, t, c.id);
    };
    repliesFor(bid, c.id).forEach(r => {
      const rr = document.createElement('div');
      rr.className = 'cmt reply';
      rr.innerHTML =
        `<div class="cwho">${r.name ? `<b>${esc(r.name)}</b> · ` : ''}${timeago(r.at)}</div>`
        + `<div class="ctxt">${esc(r.text)}</div>`
        + `<div class="cacts"><span class="cact danger" data-del>Delete</span></div>`;
      rr.querySelector('[data-del]').onclick = () => deleteComment(bid, r.id);
      el.appendChild(rr);
    });
    box.appendChild(el);
  });
  const row = document.createElement('div');
  row.className = 'cadd';
  const inp = document.createElement('input');
  inp.placeholder = 'Add a note…';
  inp.maxLength = 280;
  const go = document.createElement('button');
  go.className = 'btn ghost sm';
  go.textContent = 'Add';
  const send = () => { const v = inp.value; inp.value = ''; addComment(bid, v, null); };
  go.onclick = send;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  row.append(inp, go);
  box.appendChild(row);
  return box;
}

// ---------- Image upload ----------
// Straight onto the same inbox -> import-inbox route every other upload on the
// site uses. kind:'img' is a passthrough: it moves one file into permanent
// storage under <band>/<song>/_img/<file> and hands the path back, writing no
// rows. A unique per-upload `song` keeps concurrent adds from grabbing each
// other's file (import-inbox takes names[0] of the prefix).
async function uploadImage(file){
  if (!file) return;
  const pass = bandPass(curBand);
  if (!pass){ showGate(curBand, false); return; }
  if (file.size > INBOX_MAX)
    return say(`${file.name || 'image'} is ${(file.size / 1048576).toFixed(0)} MB — over the ${(INBOX_MAX / 1048576) | 0} MB limit.`, true);
  const stamp = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const song = '_concept/' + stamp;
  const ext = ((file.name || '').match(/\.[^.]+$/) || ['.png'])[0].toLowerCase();
  const name = 'img' + ext;
  const enc = (...seg) => seg.map(encodeURIComponent).join('/');
  say('Uploading image…');
  try {
    const r = await fetch(`${SUPA_URL}/storage/v1/object/inbox/${enc(curBand, pass, song, name)}`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY,
                 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' },
      body: file });
    if (!r.ok){
      let detail = ''; try { const j = await r.json(); detail = j.message || j.error || ''; } catch {}
      throw new Error(`Upload failed (${r.status}${detail ? ': ' + detail : ''})`);
    }
    const res = await edgeFn('import-inbox', { band: curBand, pass, song, kind: 'img' });
    if (!res || !res.ref) throw new Error('Import returned no path.');
    doc.blocks.push({ id: newBlockId(), t: 'image', ref: res.ref, alt: '', sketch: null });
    dirty = true;
    renderBlocks();
    say('Image added.');
  } catch (e) {
    say(e.message || 'Image upload failed.', true);
  }
}

// ---------- Save ----------
async function save(asNew){
  const name = $('draftName').value.trim() || 'Concept';
  // Prune empty text and empty link blocks on the way out.
  const clean = {
    target: doc.target && doc.target.kind ? doc.target : null,
    blocks: doc.blocks.filter(b =>
      b.t === 'image'
      || (b.t === 'link' && b.url && b.url.trim())
      || (b.md && b.md.trim())),
  };
  try {
    const id = await libRpc('lore_save', {
      nm: name, body_in: JSON.stringify(clean),
      vid: asNew ? null : (current ? current.id : null), d: 'concept',
    });
    dirty = false;
    say('Saved.');
    drafts = (await libRpc('lore_list', { d: 'concept' })) || [];
    current = drafts.find(d => d.id === id) || null;
    if (current){ doc = parseDoc(current.body); syncTargetControls(); renderBlocks(); }
    renderDrafts();
  } catch (e) { say(e.message, true); }
}

function say(msg, isErr){
  const el = $('docStatus');
  el.textContent = msg || '';
  el.className = 'status' + (isErr ? ' err' : ' ok');
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

// ---------- Wiring ----------
on('newBtn', 'click', () => newDraft(false));
on('saveBtn', 'click', () => save(false));
on('saveNewBtn', 'click', () => save(true));
on('addTextBtn', 'click', () => { doc.blocks.push({ id: newBlockId(), t: 'text', md: '' }); dirty = true; openEditor(doc.blocks.length - 1); });
on('addImageBtn', 'click', () => $('addImageFile').click());
on('addImageFile', 'change', (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) uploadImage(f);
});
// + Link — any URL, no upload. If it points at an image or GIF it becomes an
// inline image block (rendered by publicUrl()'s http(s) passthrough, and the
// pen works over it); anything else becomes a clickable link block.
on('addLinkBtn', 'click', () => {
  const url = (prompt('Paste a link — an image, a GIF, or any URL') || '').trim();
  if (!url) return;
  if (!/^https?:\/\/\S+$/i.test(url)) return say('That does not look like a URL.', true);
  const isImg = /\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?|#|$)/i.test(url);
  doc.blocks.push(isImg
    ? { id: newBlockId(), t: 'image', ref: url, alt: '', sketch: null }
    : { id: newBlockId(), t: 'link', url, label: '' });
  dirty = true;
  renderBlocks();
});
$('blocks').closest('.editor').addEventListener('paste', (e) => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items){
    if (it.kind === 'file' && it.type.startsWith('image/')){
      e.preventDefault();
      uploadImage(it.getAsFile());
      return;
    }
  }
});
on('draftName', 'input', () => { dirty = true; });
$('cName').value = localStorage.getItem('mp_name') || '';
on('cName', 'change', () => localStorage.setItem('mp_name', $('cName').value.trim()));
addEventListener('beforeunload', (e) => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

// core.js only calls App.init() on a hashchange, after the gate opens, and on
// logout — never at load. Every page kicks itself off, and this one has to as
// well or it sits behind `body.locked` with the gate closed, which looks
// exactly like an empty page.
init();
</script>
</body>
