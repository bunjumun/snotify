; Module 5: A2DP source spike. Separate project so the radio's firmware and
; flash layout are untouched. Same platform/board/PSRAM/partition choices as
; ../platformio.ini (see the reasons there). Reflashing the radio afterwards
; is `pio run -e radio -t upload` from the parent directory.
[env:spike]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = ../partitions.csv
build_flags = -D CORE_DEBUG_LEVEL=4 -D BOARD_HAS_PSRAM
lib_deps = https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 115200

; A/B for the ML301 disconnect: identical sketch on Arduino core 2.0.17
; (IDF 4.4), the core ESP32-A2DP was mostly developed against.
[env:spike-core2]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = ../partitions.csv
build_flags = -D CORE_DEBUG_LEVEL=4 -D BOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
lib_deps = https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
monitor_speed = 115200
upload_speed = 115200
