<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Underwater Projection</title>
<!--
  Underwater projection - WebGL2, no dependencies, classic scripts (runs from file://).
  Light on black: a projector adds light, it cannot darken, so "underwater" is moving
  caustics, glints, bubble rims, foam and creatures over a tinted wash.

  engine/            shared runtime (parameters, physics, bubbles/foam, fauna, shaders, scene registry)
  scenes/fluid fx/   one file per scene; each calls FluidFX.registerScene({...})
  README.md          scene contract and the ports a host project plugs into

  Keys: 1-9 scene | F fullscreen | H hide panel | Space pause | Up/Down level | R restart cycle | L line style
-->
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfe9ee}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
body.idle{cursor:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:#ffb4a8;font-size:14px;white-space:pre-wrap}
#panel{position:fixed;top:10px;left:10px;width:280px;max-height:calc(100% - 20px);overflow:auto;padding:8px 10px 10px;background:rgba(3,13,17,.86);border:1px solid #1b4750;border-radius:8px;backdrop-filter:blur(6px);transition:opacity .25s}
body.idle #panel{opacity:0;pointer-events:none}
body.nopanel #panel{display:none}
#panel h1{font-size:12px;margin:0 0 6px;color:#7fe3ee;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
#panel details{border-top:1px solid #12363d;padding:4px 0}
#panel summary{cursor:pointer;color:#7fe3ee;padding:2px 0;user-select:none}
.row{display:grid;grid-template-columns:92px 1fr 38px;gap:6px;align-items:center;margin:3px 0}
.row.bool{grid-template-columns:92px 1fr}
.row label{color:#8db8be;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{text-align:right;color:#cdeff3}
input[type=range]{width:100%;accent-color:#3fc7d6;margin:0}
select{width:100%;background:#06242b;color:#cdeff3;border:1px solid #1b4750;border-radius:4px;padding:2px;grid-column:span 2}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
button{background:#06242b;color:#cdeff3;border:1px solid #1b4750;border-radius:4px;padding:3px 7px;font:inherit;cursor:pointer}
button:hover{border-color:#3fc7d6}
button.on{background:#0e5560;border-color:#3fc7d6}
.sw{width:22px;height:22px;padding:0;border-radius:11px}
/* fold handles: dashed line along the wall/ceiling and wall/floor corner, a tab to drag it; they follow the panel's visibility */
.fold{position:fixed;height:0;border-top:1px dashed rgba(63,199,214,.85);transform-origin:0 0;pointer-events:none;z-index:4}
.foldtab{position:fixed;transform:translate(-50%,-50%);padding:2px 10px;background:rgba(3,13,17,.86);border:1px solid #3fc7d6;border-radius:11px;color:#7fe3ee;cursor:grab;touch-action:none;user-select:none;z-index:5;transition:opacity .25s}
/* detected-object boxes (Avoidance > Show boxes) */
.obstacle{position:fixed;display:none;border:1px dashed #ffb04a;background:rgba(255,176,74,.12);pointer-events:none;z-index:3}
body.idle .foldui{opacity:0;pointer-events:none}
body.nopanel .foldui{display:none}
#stat{margin-top:6px;color:#5f8a91;font-size:11px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="msg"></div>
<aside id="panel"></aside>
<noscript>This page needs JavaScript and WebGL2.</noscript>
<script src="engine/util.js"></script>
<script src="engine/params.js"></script>
<script src="engine/physics.js"></script>
<script src="engine/sim.js"></script>
<script src="engine/fauna.js"></script>
<script src="engine/shaders/common.js"></script>
<script src="engine/shaders/water.js"></script>
<script src="engine/shaders/creatures.js"></script>
<script src="engine/shaders/passes.js"></script>
<script src="engine/shaders/room.js"></script>
<script src="engine/shaders/space.js"></script>
<script src="engine/scenes.js"></script>
<!-- scenes: add a file under scenes/ and a tag here -->
<script src="scenes/fluid-fx/caustics.js"></script>
<script src="scenes/fluid-fx/god-rays.js"></script>
<script src="scenes/fluid-fx/deep-drift.js"></script>
<script src="scenes/fluid-fx/rising-liquid.js"></script>
<script src="scenes/fluid-fx/line-art.js"></script>
<script src="engine/engine.js"></script>
</body>
</html>
