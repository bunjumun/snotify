; Lakehorse Radio SD card bench test.
;
; A throwaway firmware that proves the micro SD wiring before any SD-based
; player code is written. It mounts the card, prints its size and lists the
; root directory, then idles. Flashing it overwrites the streaming radio;
; ../../firmware/lakehorse-radio/ holds the binaries to put that back.
;
; Settings are copied from ../platformio.ini on purpose, so this test runs on
; the exact core and board profile the radio already proved on this hardware:
;
;   * Same pinned pioarduino platform, so no new toolchain gets downloaded.
;   * board = esp32dev, because this board is a CP2102 and the esp-wrover-kit
;     profile looks for an FTDI chip.
;   * upload_speed = 115200, because faster uploads corrupted images on this
;     board and cable.
;
; Wiring (VSPI): CS=5, MOSI=23, MISO=19, SCK=18. GPIO12 is avoided because it
; is a boot strapping pin, and 16/17 because the WROVER's PSRAM sits on them.

[env:sdtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-0001
upload_speed = 115200
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
