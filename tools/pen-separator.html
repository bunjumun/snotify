<body>

    <h1>Highlighter Pen Plotter Separator - Mk2</h1>



    <div id="controls">

        <input type="file" id="imageInput" accept="image/*">

        <button id="processHighlighterBtn" class="btn-highlighter">Generate Highlighter Layers</button>

    </div>



    <img id="preview" src="#" alt="Image Preview">



    <div id="output">

        </div>



    <button id="downloadAllBtn" style="display: none;">Download All as Zip</button>



    <h2 style="margin-top: 40px; width: 100%; text-align: center; display: none;" id="combinedTitle">Combined Previews</h2>

    <div id="combinedOutput">

        </div>



    <script>

        document.getElementById('processHighlighterBtn').addEventListener('click', processHighlighterLayers);

        document.getElementById('downloadAllBtn').addEventListener('click', downloadAllImagesAsZip);

        const imageInput = document.getElementById('imageInput');

        const outputDiv = document.getElementById('output');

        const combinedOutputDiv = document.getElementById('combinedOutput');

        const combinedTitle = document.getElementById('combinedTitle');

        const previewImage = document.getElementById('preview');

        const downloadAllBtn = document.getElementById('downloadAllBtn');



        let generatedCanvases = []; // To store canvases for zipping

        let lastProcessedImageDimensions = { width: 0, height: 0 }; // Store dimensions for combined canvases



        imageInput.addEventListener('change', function(e) {

            const file = e.target.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function(e) {

                    previewImage.src = e.target.result;

                    previewImage.style.display = 'block'; // Show the preview

                };

                reader.readAsDataURL(file);

            } else {

                previewImage.src = '#';

                previewImage.style.display = 'none'; // Hide if no file selected

            }

        });



        function processHighlighterLayers() {

            const file = imageInput.files[0];

            if (!file) {

                alert('Please select an image file first.');

                return;

            }



            const reader = new FileReader();

            reader.onload = function(e) {

                const img = new Image();

                img.onload = function() {

                    outputDiv.innerHTML = ''; // Clear previous outputs

                    combinedOutputDiv.innerHTML = ''; // Clear previous combined outputs

                    combinedTitle.style.display = 'none'; // Hide combined title

                    generatedCanvases = []; // Clear previous canvases for zipping

                    downloadAllBtn.style.display = 'none'; // Hide zip button until images are processed



                    lastProcessedImageDimensions = { width: img.width, height: img.height };



                    // Create original canvas to get pixel data

                    const originalCanvas = createCanvas(img.width, img.height);

                    const originalCtx = originalCanvas.getContext('2d');

                    originalCtx.drawImage(img, 0, 0, img.width, img.height);

                    

                    // Add original image to output and generatedCanvases

                    addCanvasToDisplayAndZip(originalCanvas, 'Original Image (for reference)', 'original_ref.png', outputDiv);



                    const imageData = originalCtx.getImageData(0, 0, img.width, img.height);

                    const pixels = imageData.data; // R, G, B, A values from original image



                    // --- Process for Highlighter CMYK Layers ---

                    // Temporarily store CMYK values in the pixels array for re-use of generateHalftone

                    for (let y = 0; y < img.height; y++) {

                        for (let x = 0; x < img.width; x++) {

                            const i = (y * img.width + x) * 4;

                            const r = pixels[i];

                            const g = pixels[i + 1];

                            const b = pixels[i + 2];



                            // Convert RGB to CMYK for this pixel

                            const cmyk = rgbToCmyk(r, g, b);

                            pixels[i] = cmyk[0];      // C value (stored in R slot)

                            pixels[i + 1] = cmyk[1];  // M value (stored in G slot)

                            pixels[i + 2] = cmyk[2];  // Y value (stored in B slot)

                            pixels[i + 3] = cmyk[3];  // K value (stored in A slot)

                        }

                    }



                    // Define line spacing for high and low resolution

                    const highResLineSpacing = 3; 

                    const lowResLineSpacing = 8; 

                    

                    // Define squiggle parameters

                    const squiggleAmplitude = 2; 

                    const squiggleFrequency = 0.5; 

                    const squiggleAngleOffset = Math.PI / 4; 



                    // Define jagged parameters

                    const jaggedMaxOffset = 1.5; // Max random offset for line segment points

                    const jaggedLineWidthVariation = 0.8; // Max random variation in line width

                    const jaggedDensityFactor = 2; // How much density influences jagginess



                    // Angles for different layers

                    const angleYellow = 0;   // Horizontal

                    const anglePink = 60;    // Diagonal

                    const angleBlue = 30;    // Diagonal

                    const angleBlack = 90;   // Vertical



                    // Store generated canvases for combining

                    const straightLineCanvasesHighRes = [];

                    const straightLineCanvasesLowRes = [];

                    const squiggleCanvasesHighRes = [];

                    const squiggleCanvasesLowRes = [];

                    const jaggedCanvasesHighRes = []; // New array for jagged layers

                    const jaggedCanvasesLowRes = [];  // New array for jagged layers



                    let canvas;

                    

                    // --- Generate Straight Line Layers ---

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', highResLineSpacing, angleYellow);

                    straightLineCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (High Res)', 'yellow_highres_lines.png', outputDiv);



                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', lowResLineSpacing, angleYellow);

                    straightLineCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (Low Res)', 'yellow_lowres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.pink, 'green', highResLineSpacing, anglePink);

                    straightLineCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (High Res)', 'pink_highres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.pink, 'green', lowResLineSpacing, anglePink);

                    straightLineCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (Low Res)', 'pink_lowres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.blue, 'red', highResLineSpacing, angleBlue);

                    straightLineCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (High Res)', 'blue_highres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.blue, 'red', lowResLineSpacing, angleBlue);

                    straightLineCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (Low Res)', 'blue_lowres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', highResLineSpacing, angleBlack);

                    straightLineCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (High Res)', 'black_highres_lines.png', outputDiv);

                    

                    canvas = generateLineHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', lowResLineSpacing, angleBlack);

                    straightLineCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (Low Res)', 'black_lowres_lines.png', outputDiv);



                    // --- Generate Squiggle Line Layers ---

                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', highResLineSpacing * 1.5, angleYellow, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (Squiggle High Res)', 'yellow_highres_squiggles.png', outputDiv);



                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', lowResLineSpacing * 1.5, angleYellow, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (Squiggle Low Res)', 'yellow_lowres_squiggles.png', outputDiv);



                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.pink, 'green', highResLineSpacing * 1.5, anglePink, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (Squiggle High Res)', 'pink_highres_squiggles.png', outputDiv);

                    

                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.pink, 'green', lowResLineSpacing * 1.5, anglePink, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (Squiggle Low Res)', 'pink_lowres_squiggles.png', outputDiv);



                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.blue, 'red', highResLineSpacing * 1.5, angleBlue, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (Squiggle High Res)', 'blue_highres_squiggles.png', outputDiv);

                    

                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.blue, 'red', lowResLineSpacing * 1.5, angleBlue, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (Squiggle Low Res)', 'blue_lowres_squiggles.png', outputDiv);



                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', highResLineSpacing * 1.5, angleBlack, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (Squiggle High Res)', 'black_highres_squiggles.png', outputDiv);

                    

                    canvas = generateSquiggleHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', lowResLineSpacing * 1.5, angleBlack, squiggleAmplitude, squiggleFrequency, squiggleAngleOffset);

                    squiggleCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (Squiggle Low Res)', 'black_lowres_squiggles.png', outputDiv);



                    // --- NEW: Generate Jagged Line Layers (Colored Pencil Sketch) ---

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', highResLineSpacing * 1.2, angleYellow, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (Jagged High Res)', 'yellow_highres_jagged.png', outputDiv);



                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.yellow, 'blue', lowResLineSpacing * 1.2, angleYellow, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Yellow Highlighter (Jagged Low Res)', 'yellow_lowres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.pink, 'green', highResLineSpacing * 1.2, anglePink, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (Jagged High Res)', 'pink_highres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.pink, 'green', lowResLineSpacing * 1.2, anglePink, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Pink Highlighter (Jagged Low Res)', 'pink_lowres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.blue, 'red', highResLineSpacing * 1.2, angleBlue, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (Jagged High Res)', 'blue_highres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.blue, 'red', lowResLineSpacing * 1.2, angleBlue, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Blue Highlighter (Jagged Low Res)', 'blue_lowres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', highResLineSpacing * 1.2, angleBlack, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesHighRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (Jagged High Res)', 'black_highres_jagged.png', outputDiv);

                    

                    canvas = generateJaggedHalftone(pixels, img.width, img.height, inkColors.black, 'alpha', lowResLineSpacing * 1.2, angleBlack, jaggedMaxOffset, jaggedLineWidthVariation, jaggedDensityFactor);

                    jaggedCanvasesLowRes.push(canvas);

                    addCanvasToDisplayAndZip(canvas, 'Black Pen (Jagged Low Res)', 'black_lowres_jagged.png', outputDiv);



                    // --- Generate Combined Previews ---

                    generateCombinedPreview(straightLineCanvasesHighRes, 'Combined Straight Lines (High Res)', 'combined_straight_highres.png', combinedOutputDiv);

                    generateCombinedPreview(straightLineCanvasesLowRes, 'Combined Straight Lines (Low Res)', 'combined_straight_lowres.png', combinedOutputDiv);

                    generateCombinedPreview(squiggleCanvasesHighRes, 'Combined Squiggles (High Res)', 'combined_squiggles_highres.png', combinedOutputDiv);

                    generateCombinedPreview(squiggleCanvasesLowRes, 'Combined Squiggles (Low Res)', 'combined_squiggles_lowres.png', combinedOutputDiv);

                    generateCombinedPreview(jaggedCanvasesHighRes, 'Combined Jagged (High Res)', 'combined_jagged_highres.png', combinedOutputDiv); // New combined jagged

                    generateCombinedPreview(jaggedCanvasesLowRes, 'Combined Jagged (Low Res)', 'combined_jagged_lowres.png', combinedOutputDiv);   // New combined jagged



                    // Show the download all button after processing

                    if (generatedCanvases.length > 0) {

                        downloadAllBtn.style.display = 'block';

                        combinedTitle.style.display = 'block'; // Show combined title

                    }

                };

                img.src = e.target.result;

            };

            reader.readAsDataURL(file);

        }



        // Define consistent ink colors

        const inkColors = {

            yellow: [255, 255, 0],

            pink: [255, 0, 127],

            blue: [0, 191, 255],

            black: [0, 0, 0]

        };



        // Converts RGB (0-255) to CMYK (0-255 scale for convenience)

        function rgbToCmyk(r, g, b) {

            let r_norm = r / 255;

            let g_norm = g / 255;

            let b_norm = b / 255;



            let k = 1 - Math.max(r_norm, g_norm, b_norm);



            let c, m, y;

            if (k === 1) { 

                c = 0; m = 0; y = 0;

            } else {

                c = (1 - r_norm - k) / (1 - k);

                m = (1 - g_norm - k) / (1 - k);

                y = (1 - b_norm - k) / (1 - k);

            }

            return [Math.round(c * 255), Math.round(m * 255), Math.round(y * 255), Math.round(k * 255)];

        }



        // Function for generating straight line-based halftones

        function generateLineHalftone(sourcePixels, width, height, inkColorRGB, channelType, lineSpacing, angleDegrees) {

            const halftoneCanvas = createCanvas(width, height);

            const halftoneCtx = halftoneCanvas.getContext('2d');

            

            halftoneCtx.fillStyle = '#FFFFFF';

            halftoneCtx.fillRect(0, 0, width, height);



            halftoneCtx.strokeStyle = `rgb(${inkColorRGB[0]}, ${inkColorRGB[1]}, ${inkColorRGB[2]})`;

            halftoneCtx.lineWidth = 1;



            const angleRad = angleDegrees * Math.PI / 180;

            const cosAngle = Math.cos(angleRad);

            const sinAngle = Math.sin(angleRad);



            for (let y = 0; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const srcIndex = (y * width + x) * 4;

                    let intensity = getChannelIntensity(sourcePixels, srcIndex, channelType);

                    const density = intensity / 255;



                    const linePosition = (x * cosAngle + y * sinAngle);

                    

                    if (density > 0.05 && (linePosition % lineSpacing < 1)) {

                        halftoneCtx.beginPath();

                        const lineLength = 2; 

                        const x1 = x - lineLength * cosAngle / 2;

                        const y1 = y - lineLength * sinAngle / 2;

                        const x2 = x + lineLength * cosAngle / 2;

                        const y2 = y + lineLength * sinAngle / 2;



                        halftoneCtx.moveTo(x1, y1);

                        halftoneCtx.lineTo(x2, y2);

                        halftoneCtx.stroke();

                    }

                }

            }

            return halftoneCanvas; // Return the canvas for later display/zipping

        }



        // Function for generating squiggle line-based halftones

        function generateSquiggleHalftone(sourcePixels, width, height, inkColorRGB, channelType, lineSpacing, baseAngleDegrees, amplitude, frequency, angleOffsetRad) {

            const halftoneCanvas = createCanvas(width, height);

            const halftoneCtx = halftoneCanvas.getContext('2d');

            

            halftoneCtx.fillStyle = '#FFFFFF';

            halftoneCtx.fillRect(0, 0, width, height);



            halftoneCtx.strokeStyle = `rgb(${inkColorRGB[0]}, ${inkColorRGB[1]}, ${inkColorRGB[2]})`;

            halftoneCtx.lineWidth = 1;



            const baseAngleRad = baseAngleDegrees * Math.PI / 180;

            const cosBaseAngle = Math.cos(baseAngleRad);

            const sinBaseAngle = Math.sin(baseAngleRad);



            for (let y = 0; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const srcIndex = (y * width + x) * 4;

                    let intensity = getChannelIntensity(sourcePixels, srcIndex, channelType);

                    const density = intensity / 255;



                    const mainLinePosition = (x * cosBaseAngle + y * sinBaseAngle);

                    

                    const effectiveLineSpacing = lineSpacing * (1 - density * 0.8);



                    if (density > 0.05 && (mainLinePosition % effectiveLineSpacing < 1)) {

                        const wavePhase = (x * frequency) + (y * frequency) + (angleOffsetRad * density * 5); 

                        const squiggleOffset = amplitude * density * Math.sin(wavePhase); 



                        const perpAngle = baseAngleRad + Math.PI / 2;

                        const offsetX = squiggleOffset * Math.cos(perpAngle);

                        const offsetY = squiggleOffset * Math.sin(perpAngle);



                        halftoneCtx.beginPath();

                        const segmentLength = 1; 

                        

                        const x1 = x + offsetX - segmentLength * cosBaseAngle / 2;

                        const y1 = y + offsetY - segmentLength * sinBaseAngle / 2;

                        const x2 = x + offsetX + segmentLength * cosBaseAngle / 2;

                        const y2 = y + offsetY + segmentLength * sinBaseAngle / 2;



                        halftoneCtx.moveTo(x1, y1);

                        halftoneCtx.lineTo(x2, y2);

                        halftoneCtx.stroke();

                    }

                }

            }

            return halftoneCanvas; // Return the canvas for later display/zipping

        }



        // --- NEW: Function for generating jagged line-based halftones (Colored Pencil Sketch) ---

        function generateJaggedHalftone(sourcePixels, width, height, inkColorRGB, channelType, lineSpacing, baseAngleDegrees, maxOffset, lineWidthVariation, densityFactor) {

            const halftoneCanvas = createCanvas(width, height);

            const halftoneCtx = halftoneCanvas.getContext('2d');

            

            halftoneCtx.fillStyle = '#FFFFFF';

            halftoneCtx.fillRect(0, 0, width, height);



            halftoneCtx.strokeStyle = `rgb(${inkColorRGB[0]}, ${inkColorRGB[1]}, ${inkColorRGB[2]})`;

            

            const baseAngleRad = baseAngleDegrees * Math.PI / 180;

            const cosBaseAngle = Math.cos(baseAngleRad);

            const sinBaseAngle = Math.sin(baseAngleRad);



            for (let y = 0; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const srcIndex = (y * width + x) * 4;

                    let intensity = getChannelIntensity(sourcePixels, srcIndex, channelType);

                    const density = intensity / 255;



                    const mainLinePosition = (x * cosBaseAngle + y * sinBaseAngle);

                    

                    // Lines are denser in darker areas

                    const effectiveLineSpacing = lineSpacing * (1 - density * 0.7); // Adjust for more density influence

                    

                    if (density > 0.05 && (mainLinePosition % effectiveLineSpacing < 1)) {

                        // Random offset for jagginess, influenced by density

                        const offsetX1 = (Math.random() * 2 - 1) * maxOffset * density * densityFactor;

                        const offsetY1 = (Math.random() * 2 - 1) * maxOffset * density * densityFactor;

                        const offsetX2 = (Math.random() * 2 - 1) * maxOffset * density * densityFactor;

                        const offsetY2 = (Math.random() * 2 - 1) * maxOffset * density * densityFactor;



                        // Random line width, influenced by density (darker = potentially thicker/more varied)

                        halftoneCtx.lineWidth = 1 + (Math.random() * lineWidthVariation * density * densityFactor);

                        halftoneCtx.lineCap = 'round'; // Make ends rounded like a pencil



                        halftoneCtx.beginPath();

                        const lineLength = 2; // Short segments to create texture

                        

                        const x1 = x - lineLength * cosBaseAngle / 2 + offsetX1;

                        const y1 = y - lineLength * sinBaseAngle / 2 + offsetY1;

                        const x2 = x + lineLength * cosBaseAngle / 2 + offsetX2;

                        const y2 = y + lineLength * sinBaseAngle / 2 + offsetY2;



                        halftoneCtx.moveTo(x1, y1);

                        halftoneCtx.lineTo(x2, y2);

                        halftoneCtx.stroke();

                    }

                }

            }

            return halftoneCanvas; // Return the canvas for later display/zipping

        }



        // Helper to get channel intensity based on type (C, M, Y, K)

        function getChannelIntensity(pixels, index, channelType) {

            if (channelType === 'red') { // C channel (corresponds to Blue highlighter, but based on C channel)

                return pixels[index];

            } else if (channelType === 'green') { // M channel (corresponds to Pink highlighter)

                return pixels[index + 1];

            } else if (channelType === 'blue') { // Y channel (corresponds to Yellow highlighter)

                return pixels[index + 2];

            } else if (channelType === 'alpha') { // K channel (corresponds to Black pen)

                return pixels[index + 3];

            }

            return 0;

        }



        // Helper function to create a canvas element with appropriate sizing

        function createCanvas(width, height) {

            const canvas = document.createElement('canvas');

            canvas.width = width;

            canvas.height = height;



            // Maintain aspect ratio for display while limiting size

            const maxWidth = 400; 

            const maxHeight = 300; 



            if (width > maxWidth || height > maxHeight) {

                const aspectRatio = width / height;

                if (width / aspectRatio > maxHeight) { 

                    canvas.style.height = `${maxHeight}px`;

                    canvas.style.width = `${maxHeight * aspectRatio}px`;

                } else { 

                    canvas.style.width = `${maxWidth}px`;

                    canvas.style.height = `${maxWidth / aspectRatio}px`;

                }

            }

            return canvas;

        }



        // Renamed and modified: Now takes a parent element to append to

        function addCanvasToDisplayAndZip(canvas, title, filename, parentElement) {

            const container = document.createElement('div');

            container.className = 'canvas-container';



            const h3 = document.createElement('h3');

            h3.textContent = title;

            container.appendChild(h3);

            container.appendChild(canvas);



            const downloadLink = document.createElement('a');

            downloadLink.href = canvas.toDataURL('image/png');

            downloadLink.download = filename;

            downloadLink.textContent = 'Download PNG';

            downloadLink.className = 'download-btn';

            container.appendChild(downloadLink);



            parentElement.appendChild(container); // Append to specified parent



            // Store the canvas and its desired filename for zipping

            generatedCanvases.push({ canvas: canvas, filename: filename });

        }



        // Function to generate and display combined preview

        function generateCombinedPreview(canvases, title, filename, parentElement) {

            const combinedCanvas = createCanvas(lastProcessedImageDimensions.width, lastProcessedImageDimensions.height);

            const combinedCtx = combinedCanvas.getContext('2d');



            // Start with a white background

            combinedCtx.fillStyle = '#FFFFFF';

            combinedCtx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);



            // Draw each layer onto the combined canvas

            // Use 'multiply' composite operation for best visual representation of ink mixing

            combinedCtx.globalCompositeOperation = 'multiply';

            canvases.forEach(layerCanvas => {

                combinedCtx.drawImage(layerCanvas, 0, 0);

            });

            combinedCtx.globalCompositeOperation = 'source-over'; // Reset to default



            // Use the centralized helper function to add to display and zip list

            addCanvasToDisplayAndZip(combinedCanvas, title, filename, parentElement);

        }



        async function downloadAllImagesAsZip() {

            if (generatedCanvases.length === 0) {

                alert('No images to download. Please process an image first.');

                return;

            }



            const zip = new JSZip();

            let promises = [];



            for (const item of generatedCanvases) {

                promises.push(new Promise(resolve => {

                    item.canvas.toBlob(function(blob) {

                        zip.file(item.filename, blob);

                        resolve();

                    }, 'image/png');

                }));

            }



            await Promise.all(promises);



            zip.generateAsync({ type: "blob" })

                .then(function(content) {

                    saveAs(content, "highlighter_layers.zip");

                })

                .catch(function(error) {

                    console.error("Error zipping files:", error);

                    alert("Failed to create zip file. See console for details.");

                });

        }

    </script>
